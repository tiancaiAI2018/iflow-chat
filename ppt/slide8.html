<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1a1a2e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #e94560;
  padding: 20pt 30pt;
}
h1 {
  color: #ffffff;
  font-size: 28pt;
  margin: 0;
}
.content {
  flex: 1;
  padding: 20pt 30pt;
  display: flex;
  gap: 25pt;
}
.build-card {
  flex: 1;
  background: #16213e;
  border-radius: 8pt;
  padding: 15pt;
}
h2 {
  color: #e94560;
  font-size: 16pt;
  margin: 0 0 12pt 0;
  border-bottom: 2pt solid #0f3460;
  padding-bottom: 8pt;
}
h3 {
  color: #a2d2ff;
  font-size: 12pt;
  margin: 10pt 0 5pt 0;
}
p {
  color: #ffffff;
  font-size: 11pt;
  margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>装备推荐</h1>
</div>
<div class="content">
  <div class="build-card">
    <h2>武器推荐</h2>
    <h3>五星武器</h3>
    <p>雾切之回光 · 磐岩结绿</p>
    <h3>四星武器</h3>
    <p>黑剑 · 笼钓瓶一心</p>
    <h3>三星武器</h3>
    <p>黎明神剑</p>
  </div>
  <div class="build-card">
    <h2>圣遗物套装</h2>
    <h3>主流选择</h3>
    <p>如雷的盛怒 4件</p>
    <p>提升雷元素伤害和反应伤害</p>
    <h3>替代选择</h3>
    <p>饰金之梦 4件</p>
    <p>平雷 4件 / 角斗士 2+如雷 2</p>
  </div>
  <div class="build-card">
    <h2>属性优先级</h2>
    <h3>主词条</h3>
    <p>时之沙：攻击/精通</p>
    <p>空之杯：雷伤加成</p>
    <p>理之冠：暴击/暴伤</p>
    <h3>副词条</h3>
    <p>暴击率 · 暴击伤害</p>
    <p>攻击力% · 元素精通</p>
  </div>
</div>
</body>
</html>

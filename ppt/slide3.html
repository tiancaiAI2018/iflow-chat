<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #16213e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #e94560;
  padding: 20pt 30pt;
}
h1 {
  color: #ffffff;
  font-size: 28pt;
  margin: 0;
}
.content {
  flex: 1;
  padding: 25pt 30pt;
  display: flex;
  gap: 20pt;
}
.text-col {
  flex: 1;
}
h2 {
  color: #a2d2ff;
  font-size: 18pt;
  margin: 0 0 12pt 0;
}
p {
  color: #ffffff;
  font-size: 13pt;
  line-height: 1.6;
  margin: 0 0 15pt 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>背景故事</h1>
</div>
<div class="content">
  <div class="text-col">
    <h2>璃月七星</h2>
    <p>刻晴是璃月七星之一，担任玉衡星一职。她对「帝君一言而决的璃月」颇有微词，但实际上，神明非常欣赏她这样的人。</p>
    <h2>理念与追求</h2>
    <p>她坚信与人类命运相关的事，应当由人类去做，而且人类一定可以做得更好。这种激进的观念让她成为璃月变革的先驱者。</p>
    <h2>工作态度</h2>
    <p>身为璃月七星，刻晴是个不折不扣的行动派。如果一件事在她看来有价值、有必要，她一定会亲力亲为。</p>
  </div>
  <div class="text-col">
    <h2>人物性格</h2>
    <p>刻晴是一个务实、高效的人。她认为依赖神明庇护只会让人变得懒惰，人类应该主动思考自己的未来。</p>
    <h2>经典语录</h2>
    <p>「帝君已经守护了璃月千年，但下一个千年，十个千年，一百个千年，也会是如此吗？」</p>
  </div>
</div>
</body>
</html>

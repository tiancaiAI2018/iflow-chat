<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #16213e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #e94560;
  padding: 20pt 30pt;
}
h1 {
  color: #ffffff;
  font-size: 28pt;
  margin: 0;
}
.content {
  flex: 1;
  padding: 25pt 30pt;
  display: flex;
  gap: 30pt;
}
.left-col {
  flex: 1;
}
.right-col {
  width: 280pt;
  display: flex;
  justify-content: center;
  align-items: center;
}
h2 {
  color: #e94560;
  font-size: 20pt;
  margin: 0 0 15pt 0;
}
p {
  color: #ffffff;
  font-size: 13pt;
  line-height: 1.6;
  margin: 0 0 12pt 0;
}
.highlight {
  background: #0f3460;
  padding: 12pt;
  border-radius: 6pt;
  border-left: 4pt solid #a2d2ff;
}
.highlight p {
  margin: 0;
  color: #a2d2ff;
  font-size: 12pt;
}
</style>
</head>
<body>
<div class="header">
  <h1>技能介绍 - 元素爆发</h1>
</div>
<div class="content">
  <div class="left-col">
    <h2>天街巡游</h2>
    <p>刻晴的元素爆发技能，以极快的速度斩击周围的敌人，造成大量雷元素范围伤害。</p>
    <p>技能包含多段连斩伤害，最后一击会造成巨额伤害，是刻晴输出的核心技能之一。</p>
    <div class="highlight">
      <p>突破天赋「玉衡之贵」：施放天街巡游时，刻晴的暴击率提升15%，元素充能效率提升15%，持续8秒。</p>
    </div>
  </div>
  <div class="right-col">
    <img src="images/keqing2.png" style="max-width: 260pt; max-height: 320pt;">
  </div>
</div>
</body>
</html>

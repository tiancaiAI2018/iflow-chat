<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #16213e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #e94560;
  padding: 20pt 30pt;
}
h1 {
  color: #ffffff;
  font-size: 28pt;
  margin: 0;
}
.content {
  flex: 1;
  padding: 25pt 30pt;
  display: flex;
  gap: 20pt;
}
.team-card {
  flex: 1;
  background: #1a1a2e;
  border-radius: 8pt;
  padding: 15pt;
  border-top: 4pt solid #a2d2ff;
}
h2 {
  color: #a2d2ff;
  font-size: 16pt;
  margin: 0 0 12pt 0;
}
h3 {
  color: #e94560;
  font-size: 13pt;
  margin: 8pt 0 5pt 0;
}
p {
  color: #ffffff;
  font-size: 11pt;
  margin: 0 0 5pt 0;
}
.role {
  color: #a2d2ff;
  font-size: 10pt;
}
</style>
</head>
<body>
<div class="header">
  <h1>配队推荐</h1>
</div>
<div class="content">
  <div class="team-card">
    <h2>激化队</h2>
    <h3>刻晴 + 纳西妲 + 菲谢尔 + 钟离</h3>
    <p class="role">主C + 草副C + 雷副C + 盾辅</p>
    <p>利用草雷激化反应大幅提升输出，是目前最强的刻晴配队之一。</p>
  </div>
  <div class="team-card">
    <h2>超导物理队</h2>
    <h3>刻晴 + 菲谢尔 + 罗莎莉亚 + 迪奥娜</h3>
    <p class="role">主C + 雷副C + 冰副C + 治疗</p>
    <p>超导降低物抗，配合物理伤害加成圣遗物打出高额物理伤害。</p>
  </div>
  <div class="team-card">
    <h2>纯雷队</h2>
    <h3>刻晴 + 菲谢尔 + 北斗 + 班尼特</h3>
    <p class="role">主C + 雷副C + 雷副C + 攻辅</p>
    <p>双雷共鸣提升充能效率，班尼特提供攻击加成和治疗。</p>
  </div>
</div>
</body>
</html>

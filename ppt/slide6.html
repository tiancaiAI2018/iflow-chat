<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1a1a2e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #e94560;
  padding: 20pt 30pt;
}
h1 {
  color: #ffffff;
  font-size: 28pt;
  margin: 0;
}
.content {
  flex: 1;
  padding: 20pt 30pt;
}
h2 {
  color: #a2d2ff;
  font-size: 18pt;
  margin: 0 0 15pt 0;
}
.constellation-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12pt;
}
.const-card {
  width: 210pt;
  background: #16213e;
  border-radius: 6pt;
  padding: 12pt;
  border-top: 3pt solid #e94560;
}
h3 {
  color: #e94560;
  font-size: 13pt;
  margin: 0 0 6pt 0;
}
p {
  color: #ffffff;
  font-size: 10pt;
  line-height: 1.4;
  margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>命之座 - 金紫定垂座</h1>
</div>
<div class="content">
  <h2>命之座效果</h2>
  <div class="constellation-grid">
    <div class="const-card">
      <h3>一命 · 雷厉</h3>
      <p>雷楔存在期间再次施放星斗归位时，在刻晴消失与出现的位置造成50%攻击力的雷元素范围伤害。</p>
    </div>
    <div class="const-card">
      <h3>二命 · 苛捐</h3>
      <p>刻晴普通攻击与重击命中受到雷元素影响的敌人时，有50%几率产生一个元素微粒。</p>
    </div>
    <div class="const-card">
      <h3>四命 · 调律</h3>
      <p>刻晴触发雷元素相关反应后的10秒内，攻击力提升25%。</p>
    </div>
    <div class="const-card">
      <h3>六命 · 廉贞</h3>
      <p>进行普通攻击、重击、施放元素战技或元素爆发时，刻晴获得6%雷元素伤害加成，持续8秒，各效果独立存在。</p>
    </div>
  </div>
</div>
</body>
</html>

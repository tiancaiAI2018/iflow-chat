<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #16213e;
  font-family: Arial, sans-serif;
  display: flex;
}
.left-panel {
  width: 280pt;
  display: flex;
  justify-content: center;
  align-items: center;
}
.right-panel {
  flex: 1;
  padding: 30pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
h1 {
  color: #e94560;
  font-size: 28pt;
  margin: 0 0 20pt 0;
}
h2 {
  color: #a2d2ff;
  font-size: 16pt;
  margin: 0 0 10pt 0;
}
p {
  color: #ffffff;
  font-size: 13pt;
  line-height: 1.6;
  margin: 0 0 15pt 0;
}
</style>
</head>
<body>
<div class="left-panel">
  <img src="images/keqing3.png" style="max-width: 250pt; max-height: 360pt;">
</div>
<div class="right-panel">
  <h1>战斗定位</h1>
  <h2>主C输出</h2>
  <p>刻晴作为雷元素单手剑角色，凭借高频的攻击和灵活的位移能力，非常适合担任队伍的主C输出位置。</p>
  <h2>激化反应</h2>
  <p>配合草元素角色可以触发激化反应，大幅提升雷元素伤害，是目前最主流的配队方向。</p>
  <h2>探索能力</h2>
  <p>星斗归位可以跨越地形障碍，是探索地图的利器。突破天赋「总务土地」还能缩短璃月探索派遣时间。</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1a1a2e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #e94560;
  padding: 20pt 30pt;
}
h1 {
  color: #ffffff;
  font-size: 28pt;
  margin: 0;
}
.content {
  flex: 1;
  padding: 20pt 30pt;
  display: flex;
  gap: 25pt;
}
.skill-card {
  flex: 1;
  background: #16213e;
  border-radius: 8pt;
  padding: 15pt;
  border-left: 4pt solid #e94560;
}
h2 {
  color: #e94560;
  font-size: 16pt;
  margin: 0 0 10pt 0;
}
h3 {
  color: #a2d2ff;
  font-size: 12pt;
  margin: 0 0 8pt 0;
}
p {
  color: #ffffff;
  font-size: 11pt;
  line-height: 1.5;
  margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>技能介绍 - 元素战技</h1>
</div>
<div class="content">
  <div class="skill-card">
    <h2>星斗归位</h2>
    <h3>元素战技</h3>
    <p>迅速投出雷楔，以疾雷之势歼敌。雷楔命中时会对小范围内的敌人造成雷元素伤害，并在命中位置留下雷楔标记。</p>
    <p style="margin-top: 8pt;">再次施放可瞬移到标记处进行斩击，造成雷元素范围伤害。</p>
  </div>
  <div class="skill-card">
    <h2>重击 · 雷暴连斩</h2>
    <h3>派生技能</h3>
    <p>在雷楔存在期间施展重击，会在标记处引发雷暴连斩，造成数次雷元素范围伤害。</p>
    <p style="margin-top: 8pt;">此技能适合对群体敌人造成大量伤害。</p>
  </div>
  <div class="skill-card">
    <h2>抵天雷罚</h2>
    <h3>突破天赋</h3>
    <p>雷楔存在期间再次施放星斗归位后的5秒内，刻晴获得雷元素附魔，普通攻击转化为雷元素伤害。</p>
  </div>
</div>
</body>
</html>
